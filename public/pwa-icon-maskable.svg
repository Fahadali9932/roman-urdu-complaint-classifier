<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGradMask" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A222C" />
      <stop offset="100%" stop-color="#0A0D12" />
    </radialGradient>
    <linearGradient id="goldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable target -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Inner Seal Shield / Hexagon (centered in safe zone) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#goldGradMask)" stroke-width="2" stroke-dasharray="8 6" opacity="0.3" />
  <polygon points="256,150 350,205 350,307 256,362 162,307 162,205" fill="#121820" stroke="url(#goldGradMask)" stroke-width="5" />

  <!-- Monogram "a." typography -->
  <text x="256" y="285" font-family="'Times New Roman', Times, serif" font-size="120" font-weight="900" fill="url(#goldGradMask)" text-anchor="middle">a.</text>
  <text x="256" y="330" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#F3E5AB" letter-spacing="4" text-anchor="middle">DEPT</text>
</svg>

