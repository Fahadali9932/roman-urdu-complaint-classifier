<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A222C" />
      <stop offset="100%" stop-color="#0A0D12" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4" />

  <!-- Outer Architectural Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2" />

  <!-- Inner Seal Shield / Hexagon -->
  <polygon points="256,130 366,194 366,322 256,386 146,322 146,194" fill="#121820" stroke="url(#goldGrad)" stroke-width="6" filter="url(#glow)" />

  <!-- Monogram "a." typography -->
  <text x="256" y="295" font-family="'Times New Roman', Times, serif" font-size="140" font-weight="900" fill="url(#goldGrad)" text-anchor="middle">a.</text>

  <!-- Subtitle Tag -->
  <text x="256" y="348" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#F3E5AB" letter-spacing="6" text-anchor="middle">DEPT</text>
</svg>

