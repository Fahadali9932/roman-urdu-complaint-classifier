    <title>Awaaz-e-Awam | Civic Complaint Portal</title>
    <meta name="description" content="Independent civic complaint routing project for Karachi." />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <!-- portal-metadata:end -->
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('awaaz_dept_theme_mode') || localStorage.getItem('aawaaz-demo-theme');
          if (mode === 'dark' || (!mode && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-[#126B63] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
